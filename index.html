<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Station</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Figtree:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">

    <!-- Top bar -->
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">◐</span>
        <span class="brand-name">weatherpop</span>
      </div>
      <form class="search" id="searchForm">
        <input type="text" id="cityInput" placeholder="Search a city…" spellcheck="false" autocomplete="off">
        <button type="submit" aria-label="Search">
          <img src="images/search.png" alt="">
        </button>
      </form>
    </header>

    <!-- Status line: shows loading / error without blocking the layout -->
    <p class="status" id="status" hidden></p>

    <main class="grid">

      <!-- Hero: current conditions -->
      <section class="hero panel">
        <div class="hero-top">
          <div>
            <h1 class="city" id="city">Jakarta</h1>
            <p class="meta" id="dateTime">—</p>
          </div>
          <img src="images/clouds.png" alt="" class="weather-icon" id="weatherIcon">
        </div>

        <div class="hero-bottom">
          <span class="temp" id="temp">—°</span>
          <span class="condition" id="condition">Loading…</span>
        </div>
      </section>

      <!-- Readouts: instrument-style data grid -->
      <section class="readouts panel">
        <h2 class="panel-title">Readouts</h2>
        <div class="readout-grid">
          <div class="readout">
            <span class="readout-label">humidity</span>
            <span class="readout-value" id="humidity">—<small>%</small></span>
          </div>
          <div class="readout">
            <span class="readout-label">wind</span>
            <span class="readout-value" id="wind">—<small>km/h</small></span>
          </div>
          <div class="readout">
            <span class="readout-label">feels like</span>
            <span class="readout-value" id="feelsLike">—<small>°</small></span>
          </div>
          <div class="readout">
            <span class="readout-label">pressure</span>
            <span class="readout-value" id="pressure">—<small>hPa</small></span>
          </div>
          <div class="readout">
            <span class="readout-label">visibility</span>
            <span class="readout-value" id="visibility">—<small>km</small></span>
          </div>
          <div class="readout">
            <span class="readout-label">sunrise · sunset</span>
            <span class="readout-value mono" id="sun">—:— · —:—</span>
          </div>
        </div>
      </section>

      <!-- Forecast strip -->
      <section class="forecast panel">
        <h2 class="panel-title">5-day outlook</h2>
        <div class="forecast-strip" id="forecastStrip">
          <!-- filled by script.js -->
        </div>
      </section>

    </main>

    <!-- Room for the next feature: charts, favorites, alerts, unit toggle, etc. -->
    <!-- <section class="panel" id="futureFeature"></section> -->

  </div>

  <script src="script.js"></script>
</body>
</html>
