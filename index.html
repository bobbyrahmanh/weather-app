<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>weather app</title>
        <link rel="stylesheet" href="style.css">

    </head>
    
    <body>
        
        <div class="card">
            <div class="search">
                <input type="text" placeholder="enter city name"
                spellcheck="false">
                <button><img src="images/search.png"></button>
            </div>
            
        </div.class>

        <div class="weather">
            <img src="images/rain.png" alt="rain" class="weather-icon">
            <h1 class="temp">22°c</h1>
            <h2 class="city">New York</h2>
            <div class="details">
            <div class="col">
                <img src="images/humidity.png">
                <div>
                    <p class="humidity">50%</p>
                    <p>Humidity</p>
                </div>
            </div>
             <div class="col">
                <img src="images/wind.png">
                <div>
                    <p class="windy">15 km/h</p>
                    <p>Wind Speed</p>
                </div>
            </div>
            </div>
            
        </div>
<script>

const apiKey= "bc25f90cdd2da7dbef9216fc2b5f9ae3";
const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=dieng";

async function checkWeather(){
    const response = await fetch(apiUrl + `&appid=${apiKey}`);
    var data = await response.json();

    console.log(data);

    document.querySelector(".city").innerHTML = data.name;
    document.querySelector(".temp").innerHTML = data.main.temp;
    document.querySelector(".humidity").innerHTML = data.main.humidity;
    document.querySelector(".sind").innerHTML = data.wind.speed;
}


checkWeather();
</script>

    </body>
</html>
