<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weather app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false">
            <button><img src="images/search.png" alt="search"></button>
        </div>

        <p class="error" style="display:none; color:#ffb4b4; margin-top:10px; text-align:left;">
            Kota tidak ditemukan
        </p>

        <div class="weather">
            <img src="images/rain.png" alt="rain" class="weather-icon">
            <h1 class="temp">22°c</h1>
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="col">
                    <img src="images/humidity.png" alt="humidity">
                    <div>
                        <p class="humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind.png" alt="wind">
                    <div>
                        <p class="windy">15 km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // GANTI dengan API key barumu dari openweathermap.org
        // (jangan pakai key lama karena sudah terlanjur terlihat publik)
        const apiKey = "API_KEY_KAMU";
        const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";

        const searchBox = document.querySelector(".search input");
        const searchBtn = document.querySelector(".search button");
        const weatherIcon = document.querySelector(".weather-icon");
        const errorMsg = document.querySelector(".error");

        async function checkWeather(city) {
            if (!city.trim()) return;

            try {
                const response = await fetch(apiUrl + encodeURIComponent(city) + `&appid=${apiKey}`);

                if (!response.ok) {
                    errorMsg.textContent = response.status === 404
                        ? "Kota tidak ditemukan"
                        : "Gagal mengambil data cuaca (cek API key kamu)";
                    errorMsg.style.display = "block";
                    return;
                }

                const data = await response.json();
                errorMsg.style.display = "none";

                document.querySelector(".city").innerHTML = data.name;
                document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°c";
                document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
                // API metric memberi kecepatan angin dalam m/s, dikonversi ke km/h
                document.querySelector(".windy").innerHTML = Math.round(data.wind.speed * 3.6) + " km/h";

                const icons = {
                    Clouds: "clouds",
                    Clear: "clear",
                    Rain: "rain",
                    Drizzle: "drizzle",
                    Mist: "mist"
                };
                const icon = icons[data.weather[0].main];
                if (icon) {
                    weatherIcon.src = `images/${icon}.png`;
                }
            } catch (error) {
                errorMsg.textContent = "Gagal terhubung. Cek koneksi internetmu.";
                errorMsg.style.display = "block";
                console.error(error);
            }
        }

        searchBtn.addEventListener("click", () => {
            checkWeather(searchBox.value);
        });

        // Bisa juga tekan Enter untuk mencari
        searchBox.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                checkWeather(searchBox.value);
            }
        });
    </script>
</body>
</html>
